services:
  - type: web
    name: petstore-api
    plan: free
    env: java
    rootDir: backend
    buildCommand: ./gradlew bootJar
    startCommand: java -jar build/libs/*.jar
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: POSTGRES_HOST
        fromDatabase:
          name: petstore-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: petstore-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: petstore-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: petstore-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: petstore-db
          property: password

  - type: web
    name: petstore-web
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: petstore-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: petstore-db
    plan: free
    databaseName: petstore
    user: petstore
